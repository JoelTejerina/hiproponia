<div class="pending-page">
  <div class="pending-wrapper">
    <mat-card class="pending-card">
      <mat-card-content class="text-center">
        <mat-icon class="pending-icon">schedule</mat-icon>
        <h1 class="h4 mb-2">Cuenta pendiente de aprobación</h1>
        <p class="text-muted mb-4">
          Tu cuenta <strong>{{ username() }}</strong> ({{ razonSocial() }}) está registrada pero debe ser aprobada por un administrador para acceder a la tienda.
        </p>
        <p class="small text-muted mb-4">
          Cuando un administrador apruebe tu cuenta, podrás iniciar sesión y ver todo el contenido.
        </p>
        <button mat-raised-button color="primary" (click)="logout()">
          <mat-icon>logout</mat-icon>
          Cerrar sesión
        </button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
