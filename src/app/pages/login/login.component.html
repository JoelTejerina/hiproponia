<div class="login-page">
  <div class="login-wrapper">
    <div class="brand-header mb-4">
      <span class="brand-icon">🌱</span>
      <h1 class="brand-name">Shop Hidroponía</h1>
      <p class="text-muted small mb-0">Inicia sesión para continuar</p>
    </div>

    <mat-card class="login-card">
      <mat-card-content>
        <form (ngSubmit)="submit()" class="login-form">
          <mat-form-field appearance="outline" class="w-100 mb-2">
            <mat-label>Usuario</mat-label>
            <input matInput type="text" [(ngModel)]="username" name="username" autocomplete="username" />
            <mat-icon matPrefix>person</mat-icon>
          </mat-form-field>

          <mat-form-field appearance="outline" class="w-100 mb-3">
            <mat-label>Contraseña</mat-label>
            <input matInput type="password" [(ngModel)]="password" name="password" autocomplete="current-password" />
            <mat-icon matPrefix>lock</mat-icon>
          </mat-form-field>

          @if (error) {
            <p class="text-danger small mb-3 d-flex align-items-center gap-1">
              <mat-icon class="error-icon">error</mat-icon>
              {{ error }}
            </p>
          }

          <button mat-raised-button color="primary" type="submit" class="w-100 py-2">
            Iniciar sesión
          </button>
        </form>
      </mat-card-content>
    </mat-card>

    <p class="small text-muted text-center mt-3 mb-0">
      Solo usuarios aprobados por un administrador pueden acceder al contenido.
    </p>

    <p class="text-center mt-3 mb-0">
      <a routerLink="/registro" class="register-link">¿Eres cliente mayorista? Regístrate aquí</a>
    </p>
  </div>
</div>
